<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>The Launch Giveaway draw — Sendoff</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400;600;700&display=swap" />
<style>
  :root{--paper:#F4F1E8;--ink:#1B1D2A;--cobalt:#2547F0;--sun:#FFC838;--poppy:#FF5A3C;--lav:#7A8DFF;--mint:#9BD3AE}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--paper);font-family:'Instrument Sans',system-ui,sans-serif;min-height:100%;overflow-x:hidden}
  .disp{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.02em}
  .wrap{max-width:520px;margin:0 auto;padding:22px 18px 60px;text-align:center}
  .brand{display:inline-flex;align-items:center;gap:8px;font-size:22px;color:var(--paper);text-decoration:none}
  .pill{display:inline-block;margin-top:16px;background:var(--poppy);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;box-shadow:3px 3px 0 var(--sun)}
  h1{font-size:clamp(34px,9vw,48px);line-height:1;margin:14px 0 6px}
  h1 .y{color:var(--sun)}
  .sub{font-size:15px;font-weight:600;opacity:.8}
  .stage{position:relative;width:min(92vw,460px);margin:24px auto 0;aspect-ratio:1/1}
  canvas#wheel{width:100%;height:100%;display:block;border-radius:50%;border:5px solid var(--ink);box-shadow:0 0 0 6px var(--sun),10px 12px 0 rgba(0,0,0,.45)}
  .pin{position:absolute;left:50%;top:-18px;transform:translateX(-50%);width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:44px solid var(--poppy);filter:drop-shadow(0 4px 0 var(--ink));z-index:3}
  .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;background:var(--paper);border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:30px;z-index:2;box-shadow:3px 3px 0 var(--ink)}
  .spin{margin-top:28px;background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:16px 36px;font-size:20px;cursor:pointer;box-shadow:6px 6px 0 var(--cobalt);transition:transform .1s}
  .spin:active{transform:translate(3px,3px)}
  .spin[disabled]{opacity:.5;cursor:default}
  .count{margin-top:14px;font-size:13px;font-weight:700;opacity:.7}
  .list{margin:26px auto 0;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;text-align:left}
  .ent{background:rgba(244,241,232,.08);border:2px solid rgba(244,241,232,.25);border-radius:12px;padding:9px 12px;font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center}
  .ent b{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--sun);color:var(--ink);align-items:center;justify-content:center;font-size:12px;flex:none}
  .ent.won{background:var(--sun);color:var(--ink);border-color:var(--ink)}
  .rules{margin-top:22px;font-size:12px;opacity:.6}
  .rules a{color:var(--paper)}

  /* the reveal */
  #win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;z-index:40;background:rgba(27,29,42,.55);backdrop-filter:blur(3px)}
  #win.show{display:flex}
  .card{background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:26px;padding:30px 26px;text-align:center;max-width:380px;width:100%;box-shadow:10px 10px 0 var(--ink);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .card .k{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--cobalt)}
  .card .n{font-size:clamp(40px,12vw,64px);line-height:1;margin:10px 0 4px}
  .card .m{font-size:16px;font-weight:600;opacity:.8}
  .card button{margin-top:18px;background:var(--ink);color:var(--paper);border:0;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:800;cursor:pointer}
  canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>

<div class="wrap">
  <a class="brand disp" href="/"><svg viewBox="0 0 640 175" style="height:34px;width:auto;display:block" aria-label="Sendoff"><text x="16" y="122" font-family="'Bricolage Grotesque',sans-serif" font-weight="800" letter-spacing="-3" font-size="92" fill="#F4F1E8">SENDOFF</text><path d="M 20 148 L 400 148 Q 470 148 516 90" fill="none" stroke="#FFC838" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 18"/><g transform="translate(508,38) rotate(-24)"><path d="M 2 32 L 82 3 L 52 76 L 37 46 Z" fill="#2547F0" stroke="#1B1D2A" stroke-width="5" stroke-linejoin="round"/><path d="M 2 32 L 82 3 L 40 40 Z" fill="#4A66F6" stroke="#1B1D2A" stroke-width="5" stroke-linejoin="round"/></g></svg></a>
  <div><span class="pill">The Launch Giveaway · the draw</span></div>
  <h1 class="disp">One spin.<br><span class="y">A send for two.</span></h1>
  <div class="sub">Every account made Nov 1–8 is on the wheel. Entry number and first name only.</div>

  <div class="stage">
    <div class="pin"></div>
    <canvas id="wheel" width="920" height="920"></canvas>
    <div class="hub"><svg viewBox="0 0 90 84" style="width:38px;height:36px"><path d="M 2 32 L 82 3 L 52 76 L 37 46 Z" fill="#2547F0" stroke="#1B1D2A" stroke-width="5" stroke-linejoin="round"/><path d="M 2 32 L 82 3 L 40 40 Z" fill="#4A66F6" stroke="#1B1D2A" stroke-width="5" stroke-linejoin="round"/></svg></div>
  </div>
  <button class="spin disp" id="spin">Spin the wheel</button>
  <div class="count" id="count"></div>

  <div class="list" id="list"></div>
  <div class="rules">Drawn at random from all valid entries. Rules at <a href="/giveaway">sendofftrips.com/giveaway</a>.</div>
</div>

<div id="win"><div class="card">
  <div class="k">The winner</div>
  <div class="n disp" id="winName">—</div>
  <div class="m" id="winMeta">A send for two, up to $200 each, on us.</div>
  <button id="close">Close</button>
</div></div>

<script>
/* ENTRIES: filled from Supabase at the Nov 8 cutoff — accounts made Nov 1–8,
   numbered in sign-up order, first names only. Marc's own accounts, family and
   anyone who has worked on Sendoff are left out, per the rules. */
const ENTRIES = [
  { n: 1, name: "Josh" }, { n: 2, name: "Noah" }, { n: 3, name: "Dom" }, { n: 4, name: "Chad" }, { n: 5, name: "Mrs. D" },
  { n: 6, name: "Dan" }, { n: 7, name: "TD" }, { n: 8, name: "CJ" }, { n: 9, name: "Mikey" }, { n: 10, name: "Luke" },
  { n: 11, name: "Enzo" }, { n: 12, name: "Meshi" }, { n: 13, name: "Vince" },
];

const cv = document.getElementById("wheel"), cx = cv.getContext("2d");
const N = ENTRIES.length, SEG = (Math.PI * 2) / N;
/* palette size picked so the last slice never matches the first */
const ALL = ["#2547F0", "#FFC838", "#FF5A3C", "#7A8DFF", "#9BD3AE", "#F4F1E8"];
const COLORS = [6, 5, 4, 3].map((k) => ALL.slice(0, k)).find((c) => N % c.length !== 1) || ALL;
let angle = 0; // rotation of the wheel, radians; segment i spans [i*SEG, (i+1)*SEG) before rotation

function draw() {
  const R = cv.width / 2;
  cx.clearRect(0, 0, cv.width, cv.height);
  cx.save(); cx.translate(R, R); cx.rotate(angle);
  ENTRIES.forEach((e, i) => {
    const a0 = i * SEG, a1 = a0 + SEG;
    cx.beginPath(); cx.moveTo(0, 0); cx.arc(0, 0, R, a0, a1); cx.closePath();
    cx.fillStyle = COLORS[i % COLORS.length]; cx.fill();
    cx.lineWidth = 6; cx.strokeStyle = "#1B1D2A"; cx.stroke();
    cx.save(); cx.rotate(a0 + SEG / 2);
    const dark = ["#FFC838", "#9BD3AE", "#F4F1E8"].includes(COLORS[i % COLORS.length]);
    cx.fillStyle = dark ? "#1B1D2A" : "#F4F1E8";
    cx.textAlign = "right"; cx.textBaseline = "middle";
    cx.font = `800 ${N > 14 ? 30 : N > 8 ? 38 : 46}px 'Bricolage Grotesque', sans-serif`;
    cx.fillText(`#${e.n} ${e.name}`, R - 36, 0);
    cx.restore();
  });
  cx.restore();
}

/* Which entry sits under the pin (the pin is at the top, i.e. -90°). */
function winnerIndex() {
  const pointer = (-Math.PI / 2 - angle) % (Math.PI * 2);
  const a = (pointer + Math.PI * 4) % (Math.PI * 2);
  return Math.floor(a / SEG);
}

/* A real random number from the browser, not Math.random. */
function randomFloat() { const u = new Uint32Array(1); crypto.getRandomValues(u); return u[0] / 4294967296; }

/* clicks as the pin passes each divider */
let ac = null;
function tick() {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "square"; o.frequency.value = 1400;
    g.gain.setValueAtTime(0.12, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.04);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.05);
  } catch (e) {}
}

const btn = document.getElementById("spin");
let spinning = false;
btn.addEventListener("click", () => {
  if (spinning || !N) return;
  spinning = true; btn.disabled = true;
  document.querySelectorAll(".ent").forEach((el) => el.classList.remove("won"));
  const turns = 6 + randomFloat() * 4;                 // 6–10 full turns
  const target = angle + turns * Math.PI * 2 + randomFloat() * Math.PI * 2;
  const start = angle, t0 = performance.now(), dur = 7000 + randomFloat() * 1500;
  let lastSeg = winnerIndex();
  const ease = (t) => 1 - Math.pow(1 - t, 4);
  function frame(now) {
    const t = Math.min(1, (now - t0) / dur);
    angle = start + (target - start) * ease(t);
    draw();
    const seg = winnerIndex();
    if (seg !== lastSeg) { tick(); lastSeg = seg; }
    if (t < 1) requestAnimationFrame(frame); else land();
  }
  requestAnimationFrame(frame);
});

function land() {
  spinning = false; btn.disabled = false; btn.textContent = "Spin again";
  const w = ENTRIES[winnerIndex()];
  document.getElementById("winName").textContent = `#${w.n} ${w.name}`;
  document.querySelector(`.ent[data-n="${w.n}"]`)?.classList.add("won");
  burst(220, innerWidth / 2, innerHeight * 0.45, 2.6, 16);
  setTimeout(() => { burst(90, innerWidth * 0.12, innerHeight * 0.6, 1.4, 14); burst(90, innerWidth * 0.88, innerHeight * 0.6, 1.4, 14); }, 350);
  setTimeout(() => document.getElementById("win").classList.add("show"), 600);
}
document.getElementById("close").addEventListener("click", () => document.getElementById("win").classList.remove("show"));

/* the list under the wheel */
const list = document.getElementById("list");
ENTRIES.forEach((e) => { const d = document.createElement("div"); d.className = "ent"; d.dataset.n = e.n; d.innerHTML = `<b>${e.n}</b>${e.name}`; list.appendChild(d); });
document.getElementById("count").textContent = `${N} entries · drawn ${new Date().toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" })}`;

/* confetti, same as the giveaway page */
const c = document.getElementById("confetti"), x = c.getContext("2d");
let W, H, parts = [], running = false;
const CONF = ["#FFC838", "#2547F0", "#FF5A3C", "#F4F1E8", "#7A8DFF"];
function size() { W = c.width = innerWidth * devicePixelRatio; H = c.height = innerHeight * devicePixelRatio; }
size(); addEventListener("resize", size);
function burst(n, ox, oy, spread, power) {
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * spread, v = (power * 0.6 + Math.random() * power) * devicePixelRatio;
    parts.push({ x: ox * devicePixelRatio, y: oy * devicePixelRatio, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: (6 + Math.random() * 8) * devicePixelRatio,
      h: (10 + Math.random() * 10) * devicePixelRatio, r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3, col: CONF[(Math.random() * CONF.length) | 0], life: 160 + Math.random() * 60 });
  }
  if (!running) { running = true; requestAnimationFrame(ctick); }
}
function ctick() {
  x.clearRect(0, 0, W, H);
  parts = parts.filter((p) => p.life > 0 && p.y < H + 40);
  parts.forEach((p) => { p.vy += 0.35 * devicePixelRatio; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
    x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.globalAlpha = Math.min(1, p.life / 40); x.fillStyle = p.col; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore(); });
  if (parts.length) requestAnimationFrame(ctick); else { running = false; x.clearRect(0, 0, W, H); }
}

document.fonts.ready.then(draw); draw();
</script>
</body>
</html>
