<body>
<!-- Netlify Forms registration. Netlify's build-time crawler only reads static
     HTML, never the React tree, so this hidden copy is the form it actually
     registers. src/components/Waitlist.jsx renders the visible one and posts
     these exact field names to it. Keep the two in step. -->
<form name="waitlist" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="waitlist" />
  <input type="text" name="bot-field" />
  <input type="text" name="name" />
  <input type="email" name="email" />
  <input type="text" name="city" />
</form>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
